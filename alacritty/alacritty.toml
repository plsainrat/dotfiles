[terminal.shell]
program="/bin/zsh"

[general]
import = [
    "themes/spaceduck.toml"
]

[window]
padding = { x = 2, y = 2 }
dynamic_padding = true
decorations_theme_variant = "Dark"
title = ""
dynamic_title = true

[mouse]
hide_when_typing = true


[keyboard]
bindings =[ { key="N",   mods="Super|Shift", action="SpawnNewInstance"},
            { key = "Return", mods = "Shift", chars = "\u001b[13;2u"},]
